name: CI

# Validation seulement : aucun déploiement automatique à ce stade.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une PR poussée plusieurs fois d'affilée n'occupe pas les exécuteurs avec des
# analyses déjà périmées.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff et pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer PyTorch (roues CPU)
        # La roue PyPI pour Linux embarque CUDA : plus de 2 Go téléchargés pour
        # rien, l'inférence tournant sur CPU. Installé avant requirements.txt
        # pour que la contrainte y soit déjà satisfaite.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0 torchvision==0.28.0

      - name: Installer les dépendances
        run: pip install -r backend/requirements-dev.txt

      - name: ruff
        run: ruff check backend tests

      - name: pytest
        run: pytest -p no:logging
        env:
          # Aucun jeton : l'assistant est éteint et ses tests simulent le
          # fournisseur. La CI ne doit appeler aucun service payant.
          HUGGINGFACE_API_TOKEN: ''

  migrations:
    name: Migrations — PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: breastai
          POSTGRES_PASSWORD: breastai
          POSTGRES_DB: breastai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U breastai -d breastai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer PyTorch (roues CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0 torchvision==0.28.0

      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt

      - name: Appliquer les migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://breastai:breastai@localhost:5432/breastai

      - name: Vérifier l'aller-retour
        # Une migration qu'on ne sait pas défaire n'est pas réversible en
        # production non plus.
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://breastai:breastai@localhost:5432/breastai

      - name: Vérifier l'absence de dérive entre modèles et schéma
        working-directory: backend
        run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://breastai:breastai@localhost:5432/breastai

  frontend:
    name: Frontend — tsc, vitest et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: tsc
        run: npm run lint

      - name: vitest
        # Les tests d'intégration sont exclus : ils exigent un backend démarré
        # et sont couverts par le job `end-to-end`.
        run: npm test

      - name: build
        run: npm run build

  end-to-end:
    name: Bout en bout — API réelle et PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inutile de monter la pile complète si les tests unitaires cassent déjà.
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: breastai
          POSTGRES_PASSWORD: breastai
          POSTGRES_DB: breastai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U breastai -d breastai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://breastai:breastai@localhost:5432/breastai
      UPLOAD_DIR: ${{ github.workspace }}/ci-uploads
      SECRET_KEY: cle-de-test-ci-sans-valeur-en-production
      FIRST_ADMIN_EMAIL: admin@breastai.local
      FIRST_ADMIN_PASSWORD: BreastAI-Dev-2026!
      # Le quota de connexion par défaut est de 10 par minute ; la suite
      # d'intégration le dépasserait. La limitation elle-même est couverte par
      # les tests backend.
      LOGIN_RATE_LIMIT: 1000/minute
      DEBUG: 'false'
      HUGGINGFACE_API_TOKEN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer PyTorch (roues CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0 torchvision==0.28.0

      - name: Installer les dépendances backend
        run: pip install -r backend/requirements.txt

      - name: Préparer la base
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.database.init_db

      - name: Démarrer l'API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/uvicorn.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API prête après ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas démarré :"
          cat "$GITHUB_WORKSPACE/uvicorn.log"
          exit 1

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Tests d'intégration
        working-directory: frontend
        run: npm run test:integration
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_TEST_EMAIL: admin@breastai.local
          VITE_TEST_PASSWORD: BreastAI-Dev-2026!
          # Sans cela, une API injoignable ferait passer le job en ignorant
          # tous les tests : un vert qui ne prouve rien.
          VITE_REQUIRE_API: '1'

      - name: Journal de l'API en cas d'échec
        if: failure()
        run: cat "$GITHUB_WORKSPACE/uvicorn.log"
