# Configuration Alembic pour BreastAI.
# Les migrations vivent sous app/database/migrations/ afin de rester dans
# l'arborescence de `app` plutôt que d'ajouter un dossier au niveau de backend/.
#
# L'URL de connexion n'est PAS écrite ici : elle est construite depuis
# app.config.settings dans env.py, pour éviter de dupliquer — ou de committer —
# les identifiants de la base.

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
