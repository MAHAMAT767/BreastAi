[tool.pytest.ini_options]
# Les tests vivent à la racine (tests/) mais importent le paquet `app`
# qui se trouve dans backend/.
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
